# Deletes Done project cards 10 days after completion. The app is on Vercel (no always-on server), so
# something external has to call the endpoint; same secrets as the broadcast scheduler.
name: Project card clean-up

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch: {}

concurrency:
  group: project-card-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the clean-up endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Set the APP_URL and CRON_SECRET repository secrets." >&2
            exit 1
          fi
          curl --fail-with-body --silent --show-error --max-time 90 \
            --retry 2 --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/project-cards"
